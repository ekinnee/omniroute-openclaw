name: Upstream Compatibility

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/upstream-compatibility.yml"
      - ".github/scripts/**"
      - "*.ts"
      - "dist/**"
      - "openclaw.plugin.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openclaw-compatibility:
    name: OpenClaw ${{ matrix.label }} (${{ matrix.spec }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: floor
            spec: 2026.7.1
            peerResolution: strict
          - label: latest
            spec: latest
            peerResolution: strict
          - label: beta
            spec: beta
            peerResolution: alias
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify package metadata against the lockfile
        run: node .github/scripts/upstream-compatibility-probe.mjs --source-contract
      - run: pnpm build
      - name: Pack the plugin
        id: pack
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d /tmp/omniroute-openclaw-package.XXXXXX)"
          npm pack --cache /tmp/omniroute-openclaw-npm-cache --pack-destination "$package_dir"
          package_path="$(find "$package_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$package_path"
          echo "package_dir=$package_dir" >> "$GITHUB_OUTPUT"
          echo "package_filename=$(basename "$package_path")" >> "$GITHUB_OUTPUT"
          echo "package_sha256=$(sha256sum "$package_path" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Resolve OpenClaw target
        id: openclaw
        env:
          OPENCLAW_SPEC: ${{ matrix.spec }}
        run: |
          set -euo pipefail
          expected_version="$(npm view "openclaw@${OPENCLAW_SPEC}" version)"
          test -n "$expected_version"
          echo "OpenClaw ${OPENCLAW_SPEC} resolves to ${expected_version}"
          echo "expected_version=$expected_version" >> "$GITHUB_OUTPUT"
      - name: Load the packaged plugin and run the public compatibility probe
        env:
          TARGET_ROLE: ${{ matrix.label }}
          OPENCLAW_SPEC: ${{ matrix.spec }}
          PEER_RESOLUTION: ${{ matrix.peerResolution }}
          EXPECTED_OPENCLAW_VERSION: ${{ steps.openclaw.outputs.expected_version }}
          PACKAGE_DIR: ${{ steps.pack.outputs.package_dir }}
          PACKAGE_FILENAME: ${{ steps.pack.outputs.package_filename }}
          PACKAGE_SHA256: ${{ steps.pack.outputs.package_sha256 }}
        run: |
          set -euo pipefail
          package_path="${PACKAGE_DIR}/${PACKAGE_FILENAME}"
          test -n "$package_path"
          test -f "$package_path"
          compat_dir="$(mktemp -d /tmp/omniroute-openclaw-compat.XXXXXX)"
          cd "$compat_dir"
          npm init --yes >/dev/null
          if [[ "$PEER_RESOLUTION" == "strict" ]]; then
            peer_flags=()
          else
            test "$TARGET_ROLE" = "beta"
            peer_flags=(--legacy-peer-deps)
            echo "The beta target is an artifact smoke row for a newer prerelease; legacy peer resolution is intentional and is not stable-floor proof."
          fi
          # Resolve moving aliases above, then install the exact immutable
          # version selected for this run with normal peer resolution. The
          # matrix remains a narrow artifact ABI probe; the release packet
          # separately proves normal OpenClaw host installation.
          npm install --cache /tmp/omniroute-openclaw-npm-cache --ignore-scripts "${peer_flags[@]}" --no-save "openclaw@${EXPECTED_OPENCLAW_VERSION}" "$package_path"
          ./node_modules/.bin/omniroute-catalog-audit --help | grep -F "Usage: omniroute-catalog-audit"
          export OPENCLAW_EXPECTED_VERSION="$EXPECTED_OPENCLAW_VERSION"
          export OPENCLAW_BUILD_VERSION="2026.7.1"
          probe_output="$(node "$GITHUB_WORKSPACE/.github/scripts/upstream-compatibility-probe.mjs" --installed-artifact)"
          printf '%s\n' "$probe_output"
          {
            echo "### OpenClaw compatibility: ${TARGET_ROLE}"
            echo "- Selector: \`openclaw@${OPENCLAW_SPEC}\`"
            echo "- Resolved version: \`${EXPECTED_OPENCLAW_VERSION}\`"
            echo "- Peer resolution: \`${PEER_RESOLUTION}\`"
            echo "- Plugin tarball SHA-256: \`${PACKAGE_SHA256}\`"
            echo "- Probe scope: packed-artifact ABI/public registration (host-install proof is separate)"
          } >> "$GITHUB_STEP_SUMMARY"
